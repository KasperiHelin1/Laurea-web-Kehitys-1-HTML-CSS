
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kauppalista</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>Kauppalista</h1>

<form id="shopping-form" class="shopping-form" novalidate>
    <div class="input-group">
        <input type="text" id="item-input"
               placeholder="Lisää tuote...">
        <span id="item-error" class="error-message"></span>
    </div>

    <div class="input-group amount-group">
        <input type="number" id="amount-input"
               placeholder="Määrä...">
        <span id="amount-error" class="error-message"></span>
    </div>

    <button type="submit">+ Lisää</button>
</form>

        <table id="shopping-list">
            <thead>
                <tr>
                    <th></th>
                    <th>Tuote</th>
                    <th>Määrä</th>
                    <th>Toiminnot</th>
                </tr>
            </thead>

            <tbody id="table-body">
            </tbody>
        </table>
    </main>
</body>
</html>
